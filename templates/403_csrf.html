{% extends "base.html" %}

{% block title %}Form expired{% endblock %}

{% block content %}
<div class="text-center py-5">
  <p class="display-1 fw-bold text-tappark mb-0">403</p>
  <h1 class="h3 mb-3">This form has expired</h1>
  <p class="text-body-secondary mb-4">
    For your security, the form couldn't be accepted (its security token was missing or out of date).
    Go back, reload the page, and try again.
  </p>
  <a href="/" class="btn btn-tappark">Back to home</a>
</div>
{% endblock %}
